[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanttro"
version = "0.1.0"
description = "Python toolkit for backtest robustness, risk/portfolio research, and prop-firm challenge simulation (with built-in BIST market support)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "quanttro" }]
urls = { Homepage = "https://github.com/HaasEnjoyer/quanttro", Repository = "https://github.com/HaasEnjoyer/quanttro" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4"]

[project.scripts]
quanttro = "quanttro.cli:main"

[tool.setuptools.packages.find]
include = ["quanttro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
